services:
  web:
    build:
      context: .
      target: dev
    image: projet-il-s6:web-dev
    command: npx nx serve web-app --host 0.0.0.0 --port 3000
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

  socket:
    build:
      context: .
      target: dev
    image: projet-il-s6:socket-dev
    command: npx nx serve socket-server --host 0.0.0.0 --port 3001
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup web socket